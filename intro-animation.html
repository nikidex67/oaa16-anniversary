<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OAA 16 — Website Intro Motion</title>
<style>
@font-face {
  font-family: 'Rosalie';
  src: url('site/assets/Rosalie-Italic-Trial.otf') format('opentype');
  font-style: italic; font-weight: 400; font-display: block;
}
@font-face {
  font-family: 'Cabinet Grotesk';
  src: url('https://cdn.fontshare.com/wf/J2PZYZURCR7HNQKXCZ4VXYA3K5FFCCLT/PZSZLWHMBCE7FFGOUYDEU33FAESUMA3X/JFDL5FBAQ2WMYL3LGKSCZKAIFCS2UQ63.woff2') format('woff2');
  font-weight: 100 900; font-display: block;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #000; overflow: hidden; }
body { display: flex; align-items: center; justify-content: center; font-family: 'Cabinet Grotesk', -apple-system, sans-serif; }

/* ---- 4:5 stage, scaled to fit the window ---- */
.stage {
  position: relative; width: 1080px; height: 1350px; overflow: hidden;
  background: #0E0C09; transform-origin: center;
}

/* ambient purple breath behind everything */
.ambient {
  position: absolute; inset: -20%;
  background: radial-gradient(circle at 50% 46%, rgba(124,58,237,.32), rgba(124,58,237,.10) 34%, transparent 62%);
  opacity: 0; animation: ambient-in 2.2s ease-out forwards;
}
@keyframes ambient-in { to { opacity: 1; } }

/* opening caption */
.caption {
  position: absolute; top: 150px; width: 100%; text-align: center;
  font-size: 27px; letter-spacing: .26em; text-transform: uppercase; white-space: nowrap;
  color: rgba(255,255,255,.85); font-weight: 500;
  opacity: 0; animation: cap-in 1.1s ease-out .35s forwards, cap-out .8s ease-in 5.4s forwards;
}
@keyframes cap-in { to { opacity: 1; } }
@keyframes cap-out { to { opacity: 0; transform: translateY(-14px); } }

/* ---- camera: pushes in during 4–6.5s ---- */
.camera {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  animation: push-in 3s cubic-bezier(.5,0,.2,1) 4s forwards;
}
@keyframes push-in { to { transform: scale(1.62) translateY(-150px); } }

/* ---- laptop ---- */
.laptop { position: relative; width: 760px; perspective: 1700px; transform: translateY(40px); }

.screen-glow {
  position: absolute; left: 50%; bottom: 96px; width: 900px; height: 620px;
  transform: translateX(-50%);
  background: radial-gradient(ellipse at 50% 90%, rgba(124,58,237,.55), rgba(124,58,237,.16) 55%, transparent 75%);
  opacity: 0; filter: blur(30px);
  animation: glow-in 2.4s ease-out 1.7s forwards;
}
@keyframes glow-in { to { opacity: 1; } }

.lid {
  position: relative; width: 760px; height: 478px;
  transform-origin: 50% 100%;
  transform: rotateX(-91deg);
  animation: lid-open 2.6s cubic-bezier(.34,.05,.14,1) 1.5s forwards;
  border-radius: 26px 26px 6px 6px;
  background: #17131F;
  box-shadow: inset 0 0 0 3px #262032, 0 -18px 70px rgba(0,0,0,.5);
  padding: 18px;
}
@keyframes lid-open { to { transform: rotateX(0deg); } }

.web {
  position: relative; width: 100%; height: 100%; overflow: hidden;
  border-radius: 12px; background: #0E0C09;
  opacity: .12; animation: screen-on 1.7s ease-out 2.5s forwards;
}
@keyframes screen-on { to { opacity: 1; } }

/* mini homepage hero on the screen */
.web .ripple {
  position: absolute; top: 0; right: 0; bottom: 0; width: 100%;
  background: url('site/assets/right-panel-bg.webp') center top/cover no-repeat;
  -webkit-mask-image: linear-gradient(to bottom, black 34%, transparent 72%);
  mask-image: linear-gradient(to bottom, black 34%, transparent 72%);
}
.web .mini-nav {
  position: absolute; top: 20px; left: 28px; right: 28px;
  display: flex; justify-content: space-between; align-items: center;
}
.web .mini-nav img { height: 30px; }
.web .mini-nav .links { display: flex; gap: 16px; align-items: center; }
.web .mini-nav .links span { color: rgba(255,255,255,.65); font-size: 11px; font-weight: 700; }
.web .mini-nav .pill {
  background: rgba(255,255,255,.14); box-shadow: inset 0 0 0 1px rgba(255,255,255,.25);
  border-radius: 999px; padding: 6px 13px; color: #fff; font-size: 10.5px; font-weight: 700;
}
.web .crest {
  position: absolute; top: 74px; left: 50%; width: 200px; transform: translateX(-50%);
  filter: drop-shadow(0 14px 26px rgba(0,0,0,.45));
  animation: bob 4.5s ease-in-out infinite;
}
@keyframes bob { 0%,100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-9px); } }
.web h2 {
  position: absolute; top: 292px; width: 100%; text-align: center;
  font-family: 'Rosalie', 'Didot', serif; font-style: italic; font-weight: 400;
  font-size: 44px; line-height: 1.14; color: #fff;
}
.web .sub {
  position: absolute; top: 408px; width: 100%; text-align: center;
  color: rgba(255,255,255,.62); font-size: 12.5px;
}

.deck {
  position: relative; width: 760px; height: 30px; margin-top: -2px;
  border-radius: 4px 4px 20px 20px;
  background: linear-gradient(#2A2436, #16121E 60%, #0B0910);
  box-shadow: 0 26px 60px rgba(0,0,0,.65);
}
.deck::after {
  content: ''; position: absolute; top: 5px; left: 50%; transform: translateX(-50%);
  width: 140px; height: 7px; border-radius: 0 0 8px 8px; background: #060509;
}
.floor {
  position: absolute; left: 50%; bottom: -46px; transform: translateX(-50%);
  width: 1050px; height: 90px; border-radius: 50%;
  background: radial-gradient(ellipse, rgba(124,58,237,.22), transparent 70%);
  filter: blur(12px); opacity: 0; animation: glow-in 2.4s ease-out 2.2s forwards;
}

/* ---- end card ---- */
.endcard {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: flex-end; padding-bottom: 130px;
  background: linear-gradient(to top, rgba(14,12,9,.95) 26%, rgba(14,12,9,.4) 58%, transparent 80%);
  opacity: 0; animation: cap-in 1s ease-out 6.6s forwards;
}
.endcard .url {
  font-size: 84px; font-weight: 800; color: #fff; letter-spacing: -.01em;
}
.endcard .sweep {
  width: 0; height: 6px; border-radius: 999px; background: #7C3AED; margin: 18px 0 26px;
  animation: sweep 0.9s cubic-bezier(.2,0,.2,1) 7s forwards;
}
@keyframes sweep { to { width: 430px; } }
.endcard .tags { font-size: 27px; color: rgba(255,255,255,.8); font-weight: 600; letter-spacing: .04em; }
.endcard .count {
  display: flex; align-items: center; gap: 12px; margin-top: 34px;
  font-size: 21px; color: rgba(255,255,255,.75); font-weight: 700;
}
.endcard .count i {
  width: 12px; height: 12px; border-radius: 50%; background: #B79CED;
  animation: blink 1.6s ease-in-out infinite;
}
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

.replay {
  position: fixed; bottom: 14px; right: 14px; z-index: 10;
  background: rgba(255,255,255,.12); color: #fff; border: 0; cursor: pointer;
  border-radius: 999px; padding: 9px 18px; font-family: inherit; font-size: 13px; font-weight: 700;
}
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="ambient"></div>
  <div class="caption">Class of 2016 · 10 Years On</div>

  <div class="camera">
    <div class="laptop">
      <div class="screen-glow"></div>
      <div class="floor"></div>
      <div class="lid">
        <div class="web">
          <div class="ripple"></div>
          <div class="mini-nav">
            <img src="site/assets/oaa16-logo-white.png" alt="OAA 16">
            <div class="links"><span class="pill">Sign in</span></div>
          </div>
          <img class="crest" src="site/assets/2016-crest.webp" alt="">
          <h2>Ten Years On.<br>One Year Group.</h2>
          <div class="sub">The Achimota School Class of 2016 is reconnecting for our 10th anniversary.</div>
        </div>
      </div>
      <div class="deck"></div>
    </div>
  </div>

  <div class="endcard">
    <div class="url">oaa2016.org</div>
    <div class="sweep"></div>
    <div class="tags">Register · RSVP · Pay dues</div>
    <div class="count"><i></i>512 Akoras registered</div>
  </div>
</div>

<button class="replay" onclick="location.reload()">↻ Replay</button>

<script>
function fit() {
  var s = Math.min(innerWidth / 1080, innerHeight / 1350);
  document.getElementById('stage').style.transform = 'scale(' + s + ')';
}
fit();
addEventListener('resize', fit);
</script>

</body>
</html>
